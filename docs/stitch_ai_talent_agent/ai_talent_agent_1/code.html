<!-- Suppression logic: "Task-Focused: Any sub-page featuring a 'Close' or 'Back' action... hide the shell" -->
<script>
        // Adjust for mobile VH
        const setVh = () => {
            let vh = window.innerHeight * 0.01;
            document.documentElement.style.setProperty('--vh', `${vh}px`);
        };
        window.addEventListener('resize', setVh);
        setVh();

        function handleConfirm() {
            // Visual feedback
            const btn = event.currentTarget;
            btn.innerHTML = '<span class="material-symbols-outlined animate-spin">sync</span> 正在准备面试环境...';
            btn.classList.add('opacity-80', 'pointer-events-none');
            
            setTimeout(() => {
                alert('正在跳转到 AI 面试间...');
                // Reset state in real app
                window.location.reload();
            }, 1500);
        }

        // Micro-interactions for inputs
        document.querySelectorAll('input, textarea').forEach(el => {
            el.addEventListener('focus', () => {
                el.parentElement.classList.add('scale-[1.01]');
            });
            el.addEventListener('blur', () => {
                el.parentElement.classList.remove('scale-[1.01]');
            });
        });
    </script>
